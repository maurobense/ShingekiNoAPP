<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta operativa | Kordena</title>
    <meta name="theme-color" content="#08111f">
    <link rel="icon" href="./kordena-icon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="catalog-page">
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid px-3">
            <div class="d-flex align-items-center gap-2">
                <a href="admin.html" class="btn btn-icon btn-outline-light border-0" title="Volver al panel">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <a class="navbar-brand brand-lockup" href="menu.html">
                    <span class="brand-mark brand-mark--sm">K</span>
                    <span>
                        <span class="brand-title">Kordena Carta</span>
                        <span class="brand-subtitle">Punto de venta</span>
                    </span>
                </a>
            </div>

            <div class="d-flex align-items-center gap-2 ms-auto">
                <span class="text-white small d-none d-sm-block" id="menu-user-name">Usuario</span>
                <button class="btn btn-icon btn-outline-light border-0" id="logout-btn" title="Salir">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <section class="catalog-hero">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3 align-items-md-center">
                <div>
                    <span class="brand-subtitle">Venta asistida</span>
                    <h1 class="h3 fw-bold mb-1">Carta de productos</h1>
                    <p class="text-muted mb-0">Selecciona items, cliente, pago y confirma el pedido.</p>
                </div>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#clientModal">
                    <i class="bi bi-person-plus me-2"></i>Nuevo cliente
                </button>
            </div>
        </section>

        <div class="category-scroll mb-3" id="category-filters">
            <button class="btn btn-dark category-btn active">Cargando...</button>
        </div>

        <div class="row g-3" id="product-grid">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
            </div>
        </div>
    </main>

    <button class="btn btn-primary cart-dock d-none" id="cart-float-btn" data-bs-toggle="modal" data-bs-target="#cartModal">
        <i class="bi bi-bag-check fs-5 me-1"></i>
        <span id="cart-count" class="fw-bold">0</span>
        <span class="mx-1">|</span>
        <span id="cart-total">$0</span>
    </button>

    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <span class="brand-subtitle">Pedido actual</span>
                        <h5 class="modal-title fw-bold">Carrito</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body p-0">
                    <div id="cart-items-container" class="list-group list-group-flush"></div>

                    <div id="cart-empty-msg" class="text-center py-5 text-muted">
                        <i class="bi bi-bag-x fs-1 opacity-50"></i>
                        <p class="mt-2 mb-0">El carrito esta vacio.</p>
                    </div>
                </div>

                <div class="p-3 border-top">
                    <div class="mb-3 position-relative">
                        <label class="form-label">Cliente</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0"><i class="bi bi-search"></i></span>
                            <input type="text" id="cart-client-search" class="form-control border-start-0" placeholder="Buscar nombre o telefono" autocomplete="off">
                            <button class="btn btn-outline-primary" type="button" data-bs-toggle="modal" data-bs-target="#clientModal" title="Nuevo cliente">
                                <i class="bi bi-person-plus-fill"></i>
                            </button>
                        </div>

                        <div id="cart-client-results" class="list-group position-absolute w-100 shadow" style="z-index: 1060; display: none; max-height: 220px; overflow-y: auto;"></div>

                        <div id="cart-client-selected-display" class="mt-2 p-2 border rounded d-none d-flex justify-content-between align-items-center">
                            <div>
                                <i class="bi bi-check-circle-fill text-success me-2"></i>
                                <span class="fw-bold" id="cart-client-name-display">-</span>
                            </div>
                            <button type="button" class="btn-close btn-sm" onclick="clearCartClient()"></button>
                        </div>

                        <input type="hidden" id="cart-selected-client-id">
                    </div>

                    <div class="mb-3 d-none" id="cart-address-container">
                        <label class="form-label">Direccion de envio</label>
                        <select id="cart-address-select" class="form-select"></select>
                    </div>

                    <div>
                        <label class="form-label">Forma de pago</label>
                        <select id="cart-payment-method" class="form-select">
                            <option value="1" selected>Efectivo</option>
                            <option value="2">MercadoPago</option>
                            <option value="3">Transferencia</option>
                            <option value="4">Enviar POS</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer d-block">
                    <div class="d-flex justify-content-between fs-5 fw-bold mb-3">
                        <span>Total</span>
                        <span id="cart-final-total" class="text-primary">$0</span>
                    </div>
                    <button class="btn btn-primary w-100 py-2" onclick="submitOrder()">
                        <i class="bi bi-check2-circle me-2"></i>Confirmar pedido
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="clientModal" tabindex="-1" style="z-index: 1070;">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <span class="brand-subtitle">Alta rapida</span>
                        <h5 class="modal-title fw-bold">Nuevo cliente</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="menu-client-form">
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label">Nombre</label>
                                <input type="text" id="new-client-name" class="form-control" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Apellido</label>
                                <input type="text" id="new-client-lastname" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Telefono</label>
                            <input type="text" id="new-client-phone" class="form-control" required>
                        </div>

                        <hr class="my-4">

                        <div class="mb-3">
                            <label class="form-label">Calle y numero</label>
                            <input type="text" id="new-client-street" class="form-control" required>
                        </div>
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label">Ciudad</label>
                                <input type="text" id="new-client-city" class="form-control" value="Ciudad de la Costa">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Etiqueta</label>
                                <input type="text" id="new-client-label" class="form-control" value="Casa">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-4 py-2">Guardar y seleccionar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('kordena_theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            if (savedTheme === 'dark') document.body.setAttribute('data-theme', 'dark');
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
