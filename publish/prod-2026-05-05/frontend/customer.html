<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil | Kordena</title>
    <meta name="theme-color" content="#111827">
    <link rel="icon" href="./kordena-icon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="public-order-page customer-profile-page">
    <header class="public-order-hero customer-profile-hero">
        <div class="public-order-shell">
            <nav class="public-order-nav">
                <div class="brand-lockup">
                    <span class="brand-mark brand-mark--sm" id="tenant-mark">K</span>
                    <span>
                        <span class="brand-title" id="tenant-name">Kordena</span>
                        <span class="brand-subtitle">Perfil cliente</span>
                    </span>
                </div>
                <div class="public-order-actions">
                    <a class="btn btn-light btn-sm" id="back-to-order" href="order.html">
                        <i class="bi bi-bag me-1"></i>Pedir
                    </a>
                    <button class="btn btn-outline-light btn-sm" id="customer-logout-btn" type="button">
                        <i class="bi bi-box-arrow-right me-1"></i>Salir
                    </button>
                </div>
            </nav>

            <div class="customer-profile-title">
                <p class="brand-subtitle mb-2">Cuenta verificada</p>
                <h1>Tu espacio de pedidos y seguimiento.</h1>
                <p id="customer-profile-subtitle">Cargando tus datos...</p>
            </div>
        </div>
    </header>

    <main class="public-order-shell customer-profile-layout">
        <section class="customer-profile-main">
            <div class="customer-current-order" id="current-order-card"></div>

            <div class="customer-panel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <span class="brand-subtitle">Historial</span>
                        <h2 class="h5 fw-bold mb-0">Tus pedidos</h2>
                    </div>
                    <button class="btn btn-sm btn-outline-dark" id="refresh-orders" type="button">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
                <div id="customer-orders-list" class="customer-orders-list">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary"></div>
                    </div>
                </div>
            </div>
        </section>

        <aside class="customer-profile-side">
            <div class="customer-panel">
                <span class="brand-subtitle">Perfil</span>
                <h2 class="h5 fw-bold mb-3">Datos personales</h2>
                <form id="customer-profile-form">
                    <label class="form-label">Nombre</label>
                    <input class="form-control mb-2" id="profile-name" required>
                    <label class="form-label">Apellido</label>
                    <input class="form-control mb-2" id="profile-lastname">
                    <label class="form-label">Telefono</label>
                    <input class="form-control mb-3" id="profile-phone" required inputmode="tel">
                    <button class="btn btn-primary w-100" type="submit">Guardar cambios</button>
                </form>
            </div>

            <div class="customer-panel">
                <span class="brand-subtitle">Seguridad</span>
                <h2 class="h5 fw-bold mb-3">Cambiar contrasena</h2>
                <form id="customer-password-form">
                    <label class="form-label">Actual</label>
                    <input class="form-control mb-2" id="current-password" type="password" required>
                    <label class="form-label">Nueva</label>
                    <input class="form-control mb-3" id="new-password" type="password" minlength="8" required>
                    <button class="btn btn-dark w-100" type="submit">Actualizar</button>
                </form>
            </div>
        </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/customerProfile.js"></script>
</body>

</html>
