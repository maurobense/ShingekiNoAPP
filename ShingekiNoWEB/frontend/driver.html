<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Repartidor | Kordena</title>
    <meta name="theme-color" content="#08111f">
    <link rel="icon" href="./kordena-icon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="driver-page" data-theme="dark">
    <main class="driver-card fade-in">
        <div class="brand-lockup justify-content-center mb-4">
            <span class="brand-mark">K</span>
            <span class="text-start">
                <span class="brand-title">Kordena</span>
                <span class="brand-subtitle">Modo repartidor</span>
            </span>
        </div>

        <div class="mb-4">
            <i class="bi bi-broadcast-pin display-4 text-warning"></i>
            <h1 class="h3 fw-bold mt-3 mb-1">Viaje en vivo</h1>
            <p class="text-muted small mb-0">Comparte tu ubicacion con el pedido asignado.</p>
        </div>

        <div class="mb-4 text-start">
            <label class="form-label">Codigo de rastreo</label>
            <input type="text" id="track-code" class="form-control form-control-lg text-center fw-bold" placeholder="Pegar codigo aqui">
        </div>

        <button id="btn-start" class="btn btn-success w-100 py-3 mb-4" onclick="startSharing()">
            <i class="bi bi-play-circle me-2"></i>Iniciar viaje
        </button>

        <section class="driver-panel">
            <div class="p-3 d-flex justify-content-between align-items-center">
                <span class="small text-muted">Estado</span>
                <div class="d-flex align-items-center gap-2">
                    <span id="status-text" class="small fw-bold text-secondary">Desconectado</span>
                    <span id="status-indicator" class="status-dot"></span>
                </div>
            </div>
            <div class="border-top p-2">
                <small id="log" class="text-muted font-monospace">Esperando inicio...</small>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>

    <script type="module">
        import { initSignalR, connection } from './js/apiService.js';
        import { showToast } from './js/ui.js';

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const codeFromUrl = params.get('code');
            if (codeFromUrl) {
                const input = document.getElementById('track-code');
                if (input) input.value = codeFromUrl;
            }
        });

        window.startSharing = async () => {
            const codeInput = document.getElementById('track-code');
            const code = codeInput.value.trim();

            if (!code) return showToast('Pega el codigo del pedido primero.', 'warning');

            const btn = document.getElementById('btn-start');
            const statusText = document.getElementById('status-text');
            const statusDot = document.getElementById('status-indicator');
            const log = document.getElementById('log');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Conectando...';

            try {
                await initSignalR();

                btn.innerHTML = '<i class="bi bi-stop-circle me-2"></i>Detener viaje';
                btn.classList.replace('btn-success', 'btn-danger');
                btn.onclick = () => window.location.reload();
                btn.disabled = false;

                statusText.textContent = 'EN VIVO';
                statusText.className = 'small fw-bold text-success';
                statusDot.classList.add('active');
                codeInput.disabled = true;

                if ('geolocation' in navigator) {
                    const geoOptions = {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 10000
                    };

                    navigator.geolocation.watchPosition(async (pos) => {
                        const { latitude, longitude, speed } = pos.coords;

                        log.innerHTML = `Lat: ${latitude.toFixed(5)} | Lng: ${longitude.toFixed(5)}<br>Vel: ${(speed || 0).toFixed(1)} m/s`;

                        try {
                            await connection.invoke('SendDriverLocation', code, latitude, longitude);
                        } catch (err) {
                            console.error('Error envio:', err);
                            log.textContent = 'Error de conexion, reintentando...';
                        }
                    }, (err) => {
                        console.warn('GPS error:', err);
                        log.textContent = 'Error GPS: ' + err.message;
                    }, geoOptions);
                } else {
                    showToast('Tu navegador no soporta GPS.', 'error');
                    window.location.reload();
                }
            } catch (e) {
                showToast('Error de conexion: ' + e.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-arrow-clockwise me-2"></i>Reintentar';
                btn.classList.replace('btn-danger', 'btn-success');
            }
        };
    </script>
</body>

</html>
