<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | OmniGestor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">

    <style>
        /* Estilos específicos para la transición del login */
        .auth-container {
            max-width: 400px;
            width: 100%;
            padding: 15px;
        }

        .form-toggle {
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
        }

        .form-toggle:hover {
            color: var(--bs-primary) !important;
            text-decoration: underline;
        }
    </style>
</head>

<body class="bg-body-tertiary d-flex align-items-center justify-content-center" style="height: 100vh; margin: 0;">

    <div class="auth-container">
        <div class="text-center mb-4 fade-in">
            <div class="d-inline-block bg-primary bg-opacity-10 p-3 rounded-circle mb-2">
                <i class="bi bi-box-seam text-primary" style="font-size: 3rem;"></i>
            </div>
            <h2 class="fw-bold mb-1">OmniGestor</h2>
            <p class="text-muted small">Panel de Gestión Comercial</p>
        </div>

        <div id="login-view" class="card border-0 shadow-sm rounded-4 p-4 fade-in">
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                        <input type="text" id="login-username" class="form-control border-start-0 bg-light" required placeholder="Ej: admin">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                        <input type="password" id="login-password" class="form-control border-start-0 bg-light" required placeholder="••••••••">
                    </div>
                </div>
                
                <div id="login-error" class="alert alert-danger small d-none py-2 text-center border-0 bg-danger bg-opacity-10 text-danger fw-bold"></div>
                
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Ingresar</button>
                
                <div class="text-center mt-4">
                    <span class="text-muted small">¿No tienes cuenta?</span> 
                    <a href="#" id="go-to-register" class="small fw-bold form-toggle text-primary">Regístrate aquí</a>
                </div>
            </form>
        </div>

        <div id="register-view" class="card border-0 shadow-sm rounded-4 p-4 d-none fade-in">
            <form id="register-form">
                <h5 class="fw-bold text-center mb-3">Crear Cuenta</h5>
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label class="form-label small fw-bold text-muted">Nombre</label>
                        <input type="text" id="reg-name" class="form-control form-control-sm bg-light" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-bold text-muted">Apellido</label>
                        <input type="text" id="reg-lastname" class="form-control form-control-sm bg-light" required>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label small fw-bold text-muted">Teléfono</label>
                    <input type="number" id="reg-phone" class="form-control form-control-sm bg-light" required>
                </div>
                <div class="mb-2">
                    <label class="form-label small fw-bold text-muted">Usuario (Login)</label>
                    <input type="text" id="reg-username" class="form-control form-control-sm bg-light" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Contraseña</label>
                    <input type="password" id="reg-password" class="form-control form-control-sm bg-light" required>
                </div>
                
                <div id="reg-error" class="alert alert-danger small d-none py-2 text-center mb-2 border-0 bg-danger bg-opacity-10 text-danger"></div>
                <div id="reg-success" class="alert alert-success small d-none py-2 text-center mb-2 border-0 bg-success bg-opacity-10 text-success fw-bold"><i class="bi bi-check-circle-fill"></i> ¡Registro exitoso!</div>
                
                <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">Crear Cuenta</button>
                
                <div class="text-center mt-3">
                    <span class="text-muted small">¿Ya tienes cuenta?</span> 
                    <a href="#" id="go-to-login" class="small fw-bold form-toggle text-primary">Inicia Sesión</a>
                </div>
            </form>
        </div>

        <p class="text-center mt-4 text-muted small opacity-50">&copy; 2026 OmniGestor Tech</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginView = document.getElementById('login-view');
            const registerView = document.getElementById('register-view');
            const goToRegisterBtn = document.getElementById('go-to-register');
            const goToLoginBtn = document.getElementById('go-to-login');

            // Cargar tema guardado usando la nueva clave de OmniGestor
            const savedTheme = localStorage.getItem('omnigestor_theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            if (savedTheme === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
            }

            // Alternar a Registro
            goToRegisterBtn.addEventListener('click', (e) => {
                e.preventDefault();
                loginView.classList.add('d-none');
                registerView.classList.remove('d-none');
            });

            // Alternar a Login
            goToLoginBtn.addEventListener('click', (e) => {
                e.preventDefault();
                registerView.classList.add('d-none');
                loginView.classList.remove('d-none');
            });
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
