<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rastreo | Kordena</title>
    <meta name="theme-color" content="#08111f">
    <link rel="icon" href="./kordena-icon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="track-page">
    <header class="track-topbar">
        <div class="track-shell py-0">
            <div class="brand-lockup">
                <span class="brand-mark brand-mark--sm">K</span>
                <span>
                    <span class="brand-title">Kordena</span>
                    <span class="brand-subtitle">Rastreo de pedido</span>
                </span>
            </div>
        </div>
    </header>

    <main class="track-shell">
        <section class="track-hero">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3 align-items-md-center">
                <div>
                    <span class="brand-subtitle">Seguimiento en vivo</span>
                    <h1 class="h3 fw-bold mb-1">Pedido #<span id="display-id">...</span></h1>
                    <p class="text-muted mb-0">El estado se actualiza automaticamente durante la preparacion y entrega.</p>
                </div>
                <span class="badge bg-light text-dark border" id="order-date">-/-</span>
            </div>
        </section>

        <div class="row g-4 justify-content-center">
            <div class="col-12 col-lg-5 col-xl-4">
                <div class="card mb-3 text-center p-4">
                    <div id="status-container" class="py-3">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="text-muted mt-2 mb-0">Conectando con Kordena...</p>
                    </div>

                    <div class="progress mt-2" style="height: 8px;">
                        <div id="status-bar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header fw-bold pt-3 d-flex justify-content-between">
                        <span><i class="bi bi-receipt me-2 text-primary"></i>Ticket</span>
                        <span class="badge bg-success bg-opacity-10 text-success border border-success" id="payment-method-badge">...</span>
                    </div>
                    <div class="card-body">
                        <div class="mb-3 border-bottom pb-2">
                            <small class="text-muted d-block">Cliente</small>
                            <span class="fw-bold" id="client-name">-</span>
                        </div>

                        <ul class="list-group list-group-flush mb-3 small" id="order-items"></ul>

                        <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                            <span class="text-muted">Total</span>
                            <span class="fs-4 fw-bold" id="order-total">$0</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-7 col-xl-6" id="map-section" style="display: none;">
                <div class="card h-100">
                    <div class="card-body p-2 position-relative">
                        <div id="map-container"></div>

                        <div class="position-absolute top-0 start-0 m-3 p-2 bg-white rounded shadow-sm" style="z-index: 999; opacity: 0.92;">
                            <small class="fw-bold text-danger">
                                <i class="bi bi-record-circle-fill"></i> EN VIVO
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('kordena_theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
            if (savedTheme === 'dark') document.body.setAttribute('data-theme', 'dark');
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="./js/track.js"></script>
</body>

</html>
